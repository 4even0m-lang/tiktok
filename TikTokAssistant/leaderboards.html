<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIVE Leaderboards — Transparent Overlay</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden;color:#fff;font-family:Segoe UI,Tahoma,Arial,sans-serif}
*{box-sizing:border-box}#boards{display:flex;gap:14px;align-items:flex-start;justify-content:flex-end;padding:10px;pointer-events:none}
.panel{min-width:245px;max-width:420px;flex:1;padding:13px 16px 15px;border-radius:18px;background:rgba(12,23,42,.82);border:1px solid rgba(142,163,202,.36);box-shadow:0 10px 23px #0004}
.panel h2{font-size:19px;margin:0 0 9px;line-height:1.5}.panel h2 span{opacity:.85}.items{display:flex;flex-direction:column;gap:7px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.06);padding:8px;border-radius:10px;font-size:15px;min-height:36px}
.item .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.item .score{font-variant-numeric:tabular-nums;color:#f8d891;white-space:nowrap}
.item .place{width:27px;flex-shrink:0}.empty{color:#b6c6e0;font-size:13px;padding:9px}
#boards:has(.panel[hidden]) .panel:not([hidden]){max-width:100%;width:100%;flex:1} .panel[hidden]{display:none!important}
body.light .panel{background:rgba(251,253,255,.93);color:#16263b;border-color:#a5b6ca}body.light .item{background:#e8eff6}body.light .empty{color:#59677d}
body.transparent .panel{background:transparent;border-color:transparent;box-shadow:none;text-shadow:0 2px 7px #000}
body.transparent .item{background:transparent}
</style></head><body><div id="boards"><section id="likers" class="panel"><h2>❤️ <span>أكثر المكبسين</span></h2><div class="items"></div></section><section id="supporters" class="panel"><h2>🎁 <span>أكثر الداعمين</span></h2><div class="items"></div></section></div>
<script>
(()=>{'use strict';
 const mode=location.pathname==='/top-likers'?'likers':(location.pathname==='/top-supporters'?'supporters':'both');
 const labels=['🥇','🥈','🥉'];
 const fmt=n=>Number(n||0).toLocaleString('en-US');
 let lastData='';
 function update(data){
   const fingerprint=JSON.stringify(data);if(fingerprint===lastData)return;lastData=fingerprint;
   const opts=data.display||{};document.body.className=opts.theme||'dark';
   for(const [kind,rows,visible] of [['likers',data.likers,opts.show_likers],['supporters',data.supporters,opts.show_supporters]]){
     const panel=document.getElementById(kind);panel.hidden=(mode!=='both'&&mode!==kind)||visible===false;
     const holder=panel.querySelector('.items');holder.replaceChildren();
     if(!Array.isArray(rows)||!rows.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=kind==='likers'?'بانتظار بيانات الإعجابات...':'بانتظار بيانات الهدايا...';holder.append(empty);continue;}
     rows.forEach((row,index)=>{const el=document.createElement('div');el.className='item';
       const place=document.createElement('span');place.className='place';place.textContent=labels[index]||(index+1)+'.';
       const name=document.createElement('span');name.className='name';name.textContent=row.name||'Viewer';
       const score=document.createElement('span');score.className='score';score.textContent=kind==='likers'?fmt(row.likes)+' ❤️':(row.coins>0?fmt(row.coins)+' 🪙':fmt(row.gifts)+' 🎁');
       el.append(place,name,score);holder.append(el);});
   }
 }
 function connect(){const scheme=location.protocol==='https:'?'wss://':'ws://';const ws=new WebSocket(scheme+location.host+'/ws/leaderboards');
 ws.onmessage=e=>{try{update(JSON.parse(e.data));}catch{}};
 ws.onclose=()=>setTimeout(connect,2200);ws.onerror=()=>ws.close();}
 connect();
 setInterval(()=>fetch('/leaderboards/data',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(data=>{if(data)update(data);}).catch(()=>{}),15000);
})();
</script></body></html>
